name: Suggest a shortcut
description: Something a step cannot do by itself, that a shortcut could.
labels: [shortcut, triage]
body:
  - type: markdown
    attributes:
      value: |
        Everything here is public. Please leave out the names of your routines, your notes,
        values, addresses, tokens and screenshots with any of those in them. If it needs
        them, write to support@routinerun.com instead.
  - type: textarea
    id: what
    attributes:
      label: What it should do
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: A shortcut that already does it, if there is one
      description: Its iCloud link or the page it is published on. If it is yours, say so; if it is somebody else's, link their page rather than the file.
  - type: checkboxes
    id: private
    attributes:
      label: Privacy
      options:
        - label: There is nothing personal in this issue
          required: true
