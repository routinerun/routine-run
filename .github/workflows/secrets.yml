# A connection's secret or address posted in an issue lets anybody send to that phone.
# This takes it out of the text and tells the person what to do, which is the one thing
# that actually helps: removing the connection in the app stops the address at once.
name: Secrets in issues
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
permissions:
  issues: write
jobs:
  redact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pattern = /\brr_[A-Za-z0-9]{8,}|api\.routinerun\.com\/v1\/in\/[0-9a-fA-F-]{8,}/g;
            const comment = context.payload.comment;
            const issue = context.payload.issue;
            const body = (comment ?? issue).body ?? '';
            if (!pattern.test(body)) return;
            const cleaned = body.replace(pattern, '[removed]');
            if (comment) await github.rest.issues.updateComment({ ...context.repo, comment_id: comment.id, body: cleaned });
            else await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body: cleaned });
            await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: ['personal-data'] });
            await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body:
              `@${(comment ?? issue).user.login} — that looked like a connection's secret or address, so it has been taken out of the text. ` +
              `It was public for a moment, so please remove that connection in the app (Settings › Connections) and make a new one: the old address stops at once.` });
